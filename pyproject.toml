[project]
name = "llm-explorer"
version = "0.1.0"
description = "LLM usage tracking and cost analysis via OpenRouter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "openai>=2.34.0",
    "python-dotenv>=1.0.0",
    "pyjwt>=2.8.0",
    "requests>=2.33.1",
    "uvicorn>=0.30.0",
    "openai-agents>=0.17.3",
    "cryptography>=42.0.0",
]

[project.scripts]
llm-explorer = "backend.main:main"
llm-explorer-api = "backend.api:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
